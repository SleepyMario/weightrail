[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weight-tracker-cli"
version = "0.1.0"
description = "Local-first SQLite-backed terminal weight tracker."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Ashwin" }
]
keywords = ["cli", "sqlite", "weight", "tracker", "terminal"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Utilities"
]
dependencies = [
  "numpy"
]

[project.optional-dependencies]
graph = [
  "plotext"
]
gui = [
  "PyGObject"
]
dev = [
  "build",
  "pytest",
  "twine"
]

[project.scripts]
weightrail = "weight_tracker_cli.cli:main"
weight-tracker = "weight_tracker_cli.cli:main"
weight-tracker-gui = "weight_tracker_cli.gui:main"

[project.urls]
Homepage = "https://github.com/SleepyMario/weight-tracker-cli"
Repository = "https://github.com/SleepyMario/weight-tracker-cli"
Issues = "https://github.com/SleepyMario/weight-tracker-cli/issues"
Changelog = "https://github.com/SleepyMario/weight-tracker-cli/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
