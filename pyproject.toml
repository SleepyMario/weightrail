[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weightrail"
version = "0.2.0"
description = "Local-first SQLite-backed weight tracker with CLI and optional GTK GUI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Ashwin" }
]
keywords = ["cli", "gtk", "sqlite", "weight", "tracker", "terminal"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Utilities"
]
dependencies = [
  "numpy"
]

[project.optional-dependencies]
graph = [
  "plotext"
]
gui = [
  "PyGObject",
  "matplotlib"
]
dev = [
  "build",
  "pytest",
  "twine"
]

[project.scripts]
weightrail = "weightrail.cli:main"
weightrail-gui = "weightrail.gui:main"

[project.urls]
Homepage = "https://github.com/SleepyMario/weightrail"
Repository = "https://github.com/SleepyMario/weightrail"
Issues = "https://github.com/SleepyMario/weightrail/issues"
Changelog = "https://github.com/SleepyMario/weightrail/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
weightrail = ["gui.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
